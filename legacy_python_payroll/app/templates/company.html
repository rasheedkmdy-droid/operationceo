{% extends "base.html" %}

{% block content %}
<div class="space-y-6">

    <!-- Header Section -->
    <div>
        <h1 class="text-2xl font-bold text-slate-900">Company Master & Statutory Settings</h1>
        <p class="text-sm text-slate-500 mt-1">Configure your MSME entity details, statutory establishment codes, and payslip signatory</p>
    </div>

    <!-- Company Settings Form -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <form method="POST" action="/company/save" class="p-6 space-y-6 text-xs">
            
            <!-- Section 1: Entity Profile -->
            <div>
                <h4 class="font-bold text-slate-800 uppercase tracking-wider text-[11px] pb-2 border-b border-slate-200 mb-4 flex items-center">
                    <span class="w-5 h-5 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center mr-2 text-[10px]">1</span>
                    MSME Corporate Details
                </h4>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="sm:col-span-2">
                        <label class="block font-medium text-slate-700 mb-1">Company / Legal Entity Name *</label>
                        <input type="text" name="company_name" required value="{{ company.company_name }}" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm font-semibold focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block font-medium text-slate-700 mb-1">MSME Udyam Registration No *</label>
                        <input type="text" name="udyam_reg_no" value="{{ company.udyam_reg_no }}" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block font-medium text-slate-700 mb-1">GSTIN Number</label>
                        <input type="text" name="gstin" value="{{ company.gstin }}" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none uppercase">
                    </div>

                    <div>
                        <label class="block font-medium text-slate-700 mb-1">Company PAN No *</label>
                        <input type="text" name="pan_no" value="{{ company.pan_no }}" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none uppercase">
                    </div>

                    <div>
                        <label class="block font-medium text-slate-700 mb-1">Tax Deduction Account No (TAN) *</label>
                        <input type="text" name="tan_no" value="{{ company.tan_no }}" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none uppercase">
                    </div>

                    <div class="sm:col-span-2">
                        <label class="block font-medium text-slate-700 mb-1">Registered Office Address</label>
                        <textarea name="address" rows="2" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">{{ company.address }}</textarea>
                    </div>

                    <div>
                        <label class="block font-medium text-slate-700 mb-1">Official Contact Phone</label>
                        <input type="text" name="phone" value="{{ company.phone }}" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block font-medium text-slate-700 mb-1">HR / Payroll Email</label>
                        <input type="email" name="email" value="{{ company.email }}" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>
            </div>

            <!-- Section 2: Statutory Registration Codes -->
            <div>
                <h4 class="font-bold text-slate-800 uppercase tracking-wider text-[11px] pb-2 border-b border-slate-200 mb-4 flex items-center">
                    <span class="w-5 h-5 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center mr-2 text-[10px]">2</span>
                    Statutory Establishment Codes
                </h4>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">EPFO / PF Establishment Code</label>
                        <input type="text" name="pf_code" value="{{ company.pf_code }}" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <span class="text-[10px] text-slate-400 mt-1 block">E.g., MH/BAN/0012345/000</span>
                    </div>

                    <div>
                        <label class="block font-medium text-slate-700 mb-1">ESIC Employer Code</label>
                        <input type="text" name="esic_code" value="{{ company.esic_code }}" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <span class="text-[10px] text-slate-400 mt-1 block">17-digit ESIC Code</span>
                    </div>

                    <div>
                        <label class="block font-medium text-slate-700 mb-1">State of Operation (for PT)</label>
                        <input type="text" name="pt_state" value="{{ company.pt_state }}" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block font-medium text-slate-700 mb-1">Default Professional Tax (₹)</label>
                        <input type="number" step="10" name="pt_default_amount" value="{{ company.pt_default_amount }}" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>

                    <div class="sm:col-span-2">
                        <label class="block font-medium text-slate-700 mb-1">Authorized Payslip Signatory</label>
                        <input type="text" name="signatory_name" value="{{ company.signatory_name }}" placeholder="Director / HR Manager" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="pt-4 border-t border-slate-200 flex justify-end">
                <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs px-6 py-2.5 rounded-lg shadow-sm transition flex items-center">
                    <i class="fa-solid fa-floppy-disk mr-2"></i> Save Company Master Settings
                </button>
            </div>

        </form>
    </div>

</div>
{% endblock %}
